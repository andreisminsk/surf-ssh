[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surf-ssh"
version = "0.1.0"
description = "Local-first browser-based file explorer and terminal for remote SSH machines"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "asyncssh>=2.14.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "cryptography>=42.0.0",
    "truststore>=0.8.0",
    "pydantic>=2.6.0",
    "websockets>=12.0",
    "pywinpty>=2.0.0; sys_platform == \"win32\"",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
surf-ssh = "src.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
